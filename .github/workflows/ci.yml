name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The zero-warning policy: a warning is a build break (AGENT.md).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  # The suite runs on every operating system the fleet uses, not just the one
  # that is cheapest to run. Building for windows and darwin without ever
  # executing a test there let three faults live indefinitely: exclude_paths
  # silently matched nothing on Windows, the file holding the mesh key was left
  # readable, and two nodes on one Windows host could not discover each other.
  # All three were invisible to a Linux-only run and obvious the moment one
  # happened on Windows.
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # No database service: the archive is embedded SQLite, so the whole
      # suite runs anywhere. Its predecessor silently skipped every
      # integration test when no PostgreSQL was reachable.
      #
      # The race detector runs on Linux only. It needs cgo and therefore a C
      # compiler, which is dependable on the ubuntu runner and less so on the
      # others; the concurrency being checked is not platform-specific, so one
      # thorough run beats three flaky ones.
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test -count=1 ./...

      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

      # Nothing in this suite may quietly skip itself.
      - name: Assert no test skipped
        if: matrix.os == 'ubuntu-latest'
        run: |
          output="$(go test -count=1 -v ./internal/integration/... 2>&1)"
          echo "$output" | tail -20
          if echo "$output" | grep -q "SKIP"; then
            echo "::error::a test skipped itself; the suite must run everywhere"
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The collector must be a dependency-free static binary: it gets dropped
      # onto machines that have no toolchain.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /tmp/ ./cmd/...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
