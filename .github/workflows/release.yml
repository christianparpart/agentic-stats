name: Release

# Tags only. A release is a thing a node will fetch and execute, so it is made
# deliberately by pushing a tag rather than as a side effect of a merge.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The whole CI suite, not a second definition of it: three operating systems,
  # the race detector, and the check that nothing skipped itself. A release is
  # the one build nobody re-cuts quietly, so it should be gated by more than a
  # pull request gets -- and a Linux-only `go test ./...` here would have been
  # less.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, sign and publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version is `git describe` output, and a
      # shallow clone cannot see the tag being released, so the binaries would
      # be stamped with a bare hash and every node would read the release as
      # unreleased.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every platform and its manifest
        run: make release

      # The tag is what the release claims to be, and the binaries carry
      # whatever `git describe` produced. If those disagree -- a tag pushed at
      # a commit that is not what was checked out, say -- the fleet would
      # converge on a version no artifact reports.
      - name: Check the stamp matches the tag
        run: |
          stamped="$(make -s version)"
          [ "$stamped" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME but binaries stamped $stamped"; exit 1; }

      # Piped, not written to a file: the key never reaches the runner's disk,
      # where it would outlive the step that used it.
      - name: Sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is unset; refusing to publish unsigned artifacts"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" |
            go run ./internal/release/cmd/relsign sign - dist/SHA256SUMS dist/SHA256SUMS.sig

      # A rehearsal of exactly what a node does before it will run a download:
      # check the signature against the public key compiled into these very
      # binaries, then check every artifact against the manifest. A mismatched
      # keypair fails here rather than on every machine in the fleet.
      - name: Verify what we are about to publish
        run: go run ./internal/release/cmd/relsign verify dist/SHA256SUMS dist/SHA256SUMS.sig dist

      # Uploaded as a draft, so nothing is downloadable until the upload itself
      # has been checked. Everything above verifies what was *built*; a release
      # is also an upload, and a partial one publishes a release some platform
      # can never fetch.
      - name: Upload as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft \
            dist/*

      # Checked against the signed manifest rather than a list written here.
      # The manifest is generated from dist, so it already knows exactly what
      # this release consists of -- and a second list would be a second home
      # for the platform set, which has drifted from the Makefile's once
      # already.
      - name: Check every artifact actually arrived
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$(
            { grep -v '^#' dist/SHA256SUMS | awk 'NF {print $2}' | sed 's/^\*//'
              printf 'SHA256SUMS\nSHA256SUMS.sig\n'
            } | sort -u
          )"
          actual="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort -u)"

          missing="$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))"
          extra="$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))"

          if [ -n "$missing" ]; then
            echo "::error::the draft is missing artifacts the manifest covers:"
            printf '  %s\n' $missing
          fi
          # An asset the manifest does not cover is unsigned, and shipping one
          # inside a signed release is the thing the signature exists to stop.
          if [ -n "$extra" ]; then
            echo "::error::the draft carries artifacts the signed manifest does not cover:"
            printf '  %s\n' $extra
          fi
          if [ -n "$missing" ] || [ -n "$extra" ]; then
            echo "The draft is left in place for inspection. Delete it with"
            echo "  gh release delete ${GITHUB_REF_NAME} --yes --cleanup-tag"
            echo "before re-pushing the tag."
            exit 1
          fi

          printf '%s\n' "$actual" | wc -l | xargs printf '%s artifacts present and all covered by the manifest\n'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
