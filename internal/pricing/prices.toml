# Prices in US dollars per million tokens.
#
# Applied at query time rather than stored on facts, so history can be
# re-priced when this table changes or a mistake is found.
#
# cache_read and cache_write default to the standard multipliers of the input
# price -- read 0.1x, 5-minute write 1.25x, 1-hour write 2x -- and are only
# stated explicitly where a model departs from them.

[[model]]
id = "claude-fable-5-1"
input = 10.0
output = 50.0
cache_read = 0.25  # 0.025x, a quarter of the usual rate

