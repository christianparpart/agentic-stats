# Local development stack. Not a production deployment: the password is fixed
# and the port is published to localhost only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic_stats
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_stats"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - agentic-pgdata:/var/lib/postgresql/data

volumes:
  agentic-pgdata:
